[project]
name = "algerplate"
version = "0.1.0"
description = ""
authors = [
    {name = "tobni-islam",email = "islamtobni@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "ultralytics (>=8.4.32,<9.0.0)",
    "opencv-python-headless (>=4.13.0.92,<5.0.0.0)",
    "albumentations (>=2.0.8,<3.0.0)",
    "paddleocr (>=3.4.0,<4.0.0)",
    "paddlepaddle (>=3.3.1,<4.0.0)",
    "fastapi[standard] (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pydantic (>=2.12.5,<3.0.0)",
    "mlflow (>=3.10.1,<4.0.0)",
    "gradio (>=6.10.0,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "huggingface-hub (>=1.14.0,<2.0.0)"
