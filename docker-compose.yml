version: "3.9"

services:
  api:
    build: .
    container_name: algerplate-api
    ports:
      - "8000:8000"
    volumes:
      # Read-only mount swap best_detection_model.pt without rebuilding
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped